{% extends 'base.html' %}
{% block title %}Staff Login | Studio Flow{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <h1 class="h2">Studio staff login</h1>
  <p class="text-muted">Reservation management requires an authorized staff account.</p>
  <form method="post" class="card border-0 shadow-sm"><div class="card-body p-4">
    {% csrf_token %}
    {% if form.errors %}<div class="alert alert-danger">Please check your username and password.</div>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Username</label>
      <input class="form-control" id="id_username" name="username" type="text" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Password</label>
      <input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-dark" type="submit">Log in</button>
  </div></form>
</div></div>
{% endblock %}
