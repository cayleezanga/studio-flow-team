{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Studio Flow{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/studio.css' %}" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md navbar-light border-bottom bg-white">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{% url 'home' %}">STUDIO <span class="brand-accent">FLOW</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'schedule' %}">Class Schedule</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'reservations' %}">Reservations</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5 flex-grow-1">{% block content %}{% endblock %}</main>
  <footer class="border-top py-4 small text-muted"><div class="container d-flex flex-wrap justify-content-between gap-2"><span>Studio Flow · Class project prototype</span><span>Pilates, movement, and mindful practice</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
